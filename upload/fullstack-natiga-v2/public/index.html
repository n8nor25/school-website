<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام النتائج v2</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font-family:Cairo,sans-serif}</style></head><body class="bg-slate-50">
<header class="bg-white shadow sticky top-0"><div class="max-w-5xl mx-auto p-4 flex justify-between"><h1 class="font-bold text-xl">🏫 نظام النتائج - v2</h1><div class="flex gap-2"><button id="t1" class="px-4 py-2 bg-emerald-600 text-white rounded-lg">طالب</button><button id="t2" class="px-4 py-2 bg-slate-200 rounded-lg">مدير</button></div></div></header>
<main class="max-w-5xl mx-auto p-4">
<section id="s1"><div class="bg-white p-6 rounded-2xl shadow"><div class="grid md:grid-cols-3 gap-3"><select id="grade" class="border p-3 rounded-lg"></select><input id="seat" placeholder="رقم الجلوس" class="border p-3 rounded-lg"><button id="go" class="bg-emerald-600 text-white rounded-lg font-bold">عرض</button></div></div><div id="out" class="mt-6"></div></section>
<section id="s2" class="hidden"><div id="loginBox" class="bg-white p-6 rounded-2xl shadow max-w-md mx-auto"><h2 class="font-bold mb-3">دخول المدير</h2><input id="pass" type="password" placeholder="كلمة السر" class="w-full border p-3 rounded-lg mb-3"><button id="login" class="w-full bg-slate-800 text-white py-2 rounded-lg">دخول</button><p id="lmsg" class="text-sm mt-2 text-rose-600"></p><p class="text-xs mt-3 text-slate-500">الافتراضية: admin12345 (غيرها من ADMIN_PASS)</p></div>
<div id="adminBox" class="hidden space-y-4"><div class="bg-white p-6 rounded-2xl shadow"><h3 class="font-bold mb-2">رفع ملف Excel (كل الصفوف في ملف واحد)</h3><input id="file" type="file" accept=".xlsx" class="border p-2 w-full rounded-lg"><button id="up" class="mt-3 bg-slate-800 text-white px-5 py-2 rounded-lg">رفع وتحويل</button><div id="ustatus" class="mt-2 text-sm"></div></div><div class="bg-white p-6 rounded-2xl shadow"><h3 class="font-bold">الصفوف</h3><div id="grades"></div></div></div></section>
</main>
<script>
const API=''; let token=localStorage.getItem('adminToken');
async function loadGrades(){const r=await fetch('/api/grades');const d=await r.json();document.getElementById('grade').innerHTML=d.map(x=>`<option>${x.grade}</option>`).join('');document.getElementById('grades').innerHTML=d.map(x=>`<div class="flex justify-between py1">${x.grade} - ${x.students} طالب</div>`).join('');}
loadGrades();
document.getElementById('go').onclick=async()=>{const g=grade.value,s=seat.value;const r=await fetch(`/api/result?grade=${encodeURIComponent(g)}&seat=${s}`);if(!r.ok){out.innerHTML='<p class=text-rose-600>غير موجود</p>';return;}const d=await r.json();out.innerHTML=`<div class="bg-white p-6 rounded-2xl shadow"><div class="flex justify-between"><div><h3 class="text-xl font-bold">${d.student.name}</h3><p>جلوس ${d.student.seat}</p></div><a href="/api/certificate?grade=${encodeURIComponent(g)}&seat=${s}" target="_blank" class="bg-blue-600 text-white px-4 py-2 rounded-lg h-fit">📄 تحميل شهادة PDF</a></div><p class="mt-4 text-2xl">المجموع: ${d.student.total} / ${d.max.total} - <span class="${d.isPass?'text-emerald-600':'text-rose-600'}">${d.isPass?'ناجح':'راسب'}</span></p></div>`};

document.getElementById('t1').onclick=()=>{s1.classList.remove('hidden');s2.classList.add('hidden')};
document.getElementById('t2').onclick=()=>{s2.classList.remove('hidden');s1.classList.add('hidden'); if(token){loginBox.classList.add('hidden');adminBox.classList.remove('hidden')}};
document.getElementById('login').onclick=async()=>{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass.value})});const d=await r.json();if(d.success){token=d.token;localStorage.setItem('adminToken',token);loginBox.classList.add('hidden');adminBox.classList.remove('hidden');}else{lmsg.textContent=d.error}};
if(token){loginBox.classList.add('hidden');adminBox.classList.remove('hidden')}
document.getElementById('up').onclick=async()=>{const f=file.files[0];if(!f)return;const fd=new FormData();fd.append('file',f);ustatus.textContent='جاري الرفع...';const r=await fetch('/api/upload',{method:'POST',headers:{'x-admin-token':token},body:fd});const d=await r.json();if(d.success){ustatus.innerHTML='✅ تم: '+d.sheets.map(s=>s.grade+' ('+s.students+')').join(', ');loadGrades()}else{ustatus.textContent='❌ '+d.error}};
</script></body></html>
